<!doctype html>
<html lang="en" class="tier-identified" data-font="geist">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noema — canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  /* canvas board — bespoke, tokens only */
  .board{flex:1;position:relative;overflow:hidden;
    background-color:var(--bg);
    background-image:radial-gradient(var(--hair) 1px, transparent 1px);
    background-size:22px 22px}
  .wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .cnode{position:absolute;z-index:2;width:180px;background:var(--panel);
    border:1px solid var(--hair);border-radius:var(--radius);
    box-shadow:0 8px 30px rgba(0,0,0,.35);user-select:none}
  .cnode.cn-active{border-color:color-mix(in srgb,var(--accent) 45%,var(--hair))}
  .cnode .ct{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--hair-soft);cursor:grab}
  .cnode .ct .sw{width:18px;height:18px;border-radius:6px;flex:0 0 auto;
    background:linear-gradient(160deg,var(--accent),#23264f)}
  .cnode .ct .nm{font-size:12.5px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cnode .ct .vb{font-family:var(--font-mono);font-size:10px;color:var(--accent-soft);
    background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--hair));
    padding:1px 6px;border-radius:5px}
  .cnode .cb{padding:7px 0}
  .cprow{display:flex;align-items:center;gap:8px;padding:4px 11px;font-family:var(--font-mono);
    font-size:11px;color:var(--muted);position:relative}
  .cprow.out{justify-content:flex-end;text-align:right}
  .cpdot{width:9px;height:9px;border-radius:50%;background:var(--raised);
    border:1px solid var(--hair);flex:0 0 auto}
  .cprow.in .cpdot{position:absolute;left:-5px}
  .cprow.out .cpdot{position:absolute;right:-5px}
  .cprow.in{padding-left:18px}
  .cprow.out{padding-right:18px}
  .cpdot.lit{background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-bg)}
  /* floating toolbar */
  .cbar{position:absolute;left:16px;top:16px;z-index:5;display:flex;align-items:center;gap:5px;
    background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(6px);
    border:1px solid var(--hair);border-radius:10px;padding:5px}
  .cbar .zbtn{border:1px solid var(--hair);background:var(--raised);color:var(--text);
    font:inherit;font-size:13px;width:28px;height:26px;border-radius:7px;cursor:pointer;
    display:grid;place-items:center;transition:.14s var(--ease)}
  .cbar .zbtn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--hair))}
  .cbar .zfit{width:auto;padding:0 10px;font-size:12px}
  /* floating compile action */
  .ccompile{position:absolute;right:18px;top:16px;z-index:5;display:flex;flex-direction:column;
    align-items:flex-end;gap:5px}
  .ccompile .sub{font-family:var(--font-mono);font-size:10.5px;color:var(--faint)}
  /* hint */
  .chint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;
    font-family:var(--font-mono);font-size:11px;color:var(--faint);
    background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);
    padding:5px 12px;border-radius:999px;border:1px solid var(--hair-soft)}
</style>
</head>
<body>
<div class="app two">
  <aside class="rail" id="rail"></aside>
  <section class="main">
    <div class="topbar">
      <div class="me" id="me"></div>
      <div class="crumb"><span class="sep">/</span> canvas</div>
      <div class="vis" id="vis"></div>
    </div>

    <div class="board" id="board">
      <!-- wire layer -->
      <svg class="wires" id="wires" preserveAspectRatio="none">
        <!-- text input → make -->
        <path d="M 244 116 C 300 116, 300 132, 356 132" fill="none" stroke="var(--hair)" stroke-width="1.5" />
        <!-- make.out → describe.in -->
        <path d="M 536 156 C 600 156, 600 132, 664 132" fill="none" stroke="var(--accent)" stroke-width="1.5" />
        <!-- describe.out → animate.in (text) -->
        <path d="M 844 132 C 910 132, 910 296, 524 296" fill="none" stroke="var(--hair)" stroke-width="1.5" />
        <!-- make.out → animate.in (image) -->
        <path d="M 536 180 C 470 180, 470 320, 524 320" fill="none" stroke="var(--hair)" stroke-width="1.5" />
      </svg>

      <!-- text input source -->
      <div class="cnode" style="left:64px;top:78px">
        <div class="ct"><span class="sw" style="background:linear-gradient(160deg,#6f8fd6,#23264f)"></span>
          <span class="nm">text input</span><span class="vb">input</span></div>
        <div class="cb">
          <div class="cprow out"><span>prompt<span class="cpdot lit"></span></span></div>
        </div>
      </div>

      <!-- make · flux-schnell -->
      <div class="cnode cn-active" style="left:356px;top:78px">
        <div class="ct"><span class="sw"></span>
          <span class="nm">flux-schnell</span><span class="vb">make</span></div>
        <div class="cb">
          <div class="cprow in"><span class="cpdot lit"></span>prompt</div>
          <div class="cprow out"><span>image<span class="cpdot lit"></span></span></div>
        </div>
      </div>

      <!-- describe · joycaption -->
      <div class="cnode" style="left:664px;top:78px">
        <div class="ct"><span class="sw" style="background:linear-gradient(160deg,#9a8fd6,#2b2456)"></span>
          <span class="nm">joycaption</span><span class="vb">describe</span></div>
        <div class="cb">
          <div class="cprow in"><span class="cpdot lit"></span>image</div>
          <div class="cprow out"><span>text<span class="cpdot"></span></span></div>
        </div>
      </div>

      <!-- animate · ltx-video -->
      <div class="cnode" style="left:344px;top:266px">
        <div class="ct"><span class="sw" style="background:linear-gradient(160deg,#d68f6f,#4a261c)"></span>
          <span class="nm">ltx-video</span><span class="vb">animate</span></div>
        <div class="cb">
          <div class="cprow in"><span class="cpdot"></span>text</div>
          <div class="cprow in"><span class="cpdot"></span>image</div>
          <div class="cprow out"><span>video<span class="cpdot"></span></span></div>
        </div>
      </div>

      <!-- toolbar -->
      <div class="cbar">
        <button class="zbtn" id="zout" title="zoom out">−</button>
        <button class="zbtn" id="zin" title="zoom in"><i data-lucide="plus"></i></button>
        <button class="zbtn zfit" id="zfit">fit</button>
      </div>

      <!-- compile action -->
      <div class="ccompile">
        <button class="btn" id="compile">Compile to spell <i data-lucide="chevron-right"></i></button>
        <span class="sub">3 tools · 1 spell</span>
      </div>

      <div class="chint">drag to wire · this becomes a spell</div>
    </div>
  </section>
</div>
<script src="app.js"></script>
<script>
(function(){
  // light zoom affordance on the node layer (visual only)
  const board=document.getElementById('board');
  let z=1;
  const apply=()=>{
    board.querySelectorAll('.cnode').forEach(n=> n.style.transform='scale('+z+')');
    const svg=document.getElementById('wires');
    svg.style.transform='scale('+z+')'; svg.style.transformOrigin='0 0';
    board.querySelectorAll('.cnode').forEach(n=> n.style.transformOrigin='0 0');
  };
  document.getElementById('zin').onclick =()=>{ z=Math.min(1.6, z+0.1); apply(); };
  document.getElementById('zout').onclick=()=>{ z=Math.max(0.6, z-0.1); apply(); };
  document.getElementById('zfit').onclick =()=>{ z=1; apply(); };
})();
</script>
</body>
</html>
