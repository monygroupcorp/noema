name: CI

# Two triggers on purpose:
#   pull_request — the gate a change must pass BEFORE it lands. Deliberately NOT filtered by base
#                  branch: a PR into a feature branch (stacked work) is still a change that has to
#                  pass, and a `branches: [main]` filter meant those PRs ran no gate at all — the
#                  same shape as the June outage below, where every PR targeted
#                  chainengine-migration and the crystal suite went unrun for a month.
#   push:main    — the signal that main is green AFTER it lands. Without it there is no post-merge
#                  check at all: the crystal suite went unrun from June (every PR targeted
#                  chainengine-migration, which this trigger did not cover), and the 2026-08-06 P0
#                  batch had to be re-verified by hand in a local worktree.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Hermetic gate — no live DB, no secrets. The fast feedback loop agents (and humans) must pass.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck         # tsc --noEmit (src/) — was unchecked in CI before
      - run: npm run typecheck:tests   # tsc -p tsconfig.tests.json (test tree — see that file for the tranche)
      - run: npm run typecheck:scripts # tsc -p tsconfig.scripts.json (scripts/ — whole tree, incl. migrations)
      - run: npm run test:hermetic     # adapter + architecture/boundary + template/install guards (no live DB)

  # DB-layer gate — the crystal suite that needs a real Mongo (MongoIntella, MongoModorum,
  # executionWebhook, Consuetudinum, the Compiler↔Mongo LoRA repro, …). NOT covered by the
  # hermetic `verify` job (which uses mock stores that diverge from real Mongo). This is the gate
  # that would have caught the 3 live bugs from 2026-06-09.
  crystal-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Single-node replica set (ledger Debt #2 / ruling R3): settle now wraps its two writes in a
      # Mongo transaction, and transactions require a replica set — the old standalone `mongo:7`
      # service container could not exercise the transactional path. A GitHub `services:` container
      # cannot override mongod's command to add `--replSet`, so we run it manually and initiate the
      # RS. The advertised member host is 127.0.0.1:27017, so the client reaches it as a real RS.
      - name: Start single-node replica-set Mongo
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          until [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState')" = "1" ]; do sleep 1; done
      - run: npm install --legacy-peer-deps
      # run-with-env.sh no-ops the .env load when absent. `?replicaSet=rs0` is REQUIRED — it drives
      # the driver's topology discovery so transactions are available. DB name is hardcoded
      # `noemaplane_test`. (Do NOT add directConnection=true — it disables the RS topology txns need.)
      - run: npm run test:crystal
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0

  # Pod contract gate — pins the wire contract between the host and the RunPod pod scripts
  # (progress signal, completion webhook payload, manifest/caption sidecar pairing, job-row
  # round-trip). Hermetic: no GPU, no network, no ai-toolkit. Runs in its own job so a Python
  # failure is legible as a Python failure and doesn't lengthen the Node critical path.
  pod-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches scripts/pod/aitk-trainer/Dockerfile
      - run: python3 -m unittest discover -s scripts/pod -p 'test_*.py' -v

  # Web app's own vitest suite — hermetic, no live DB. The app has its own package tree
  # (src/platforms/web/app), so it gets its own job and its own npm ci rather than sharing
  # the root install with `verify`.
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/platforms/web/app/package-lock.json
      - run: npm ci
        working-directory: src/platforms/web/app
      - run: npm test
        working-directory: src/platforms/web/app

  # Token-drift gate — flags CSS declarations that bypass the design tokens (hardcoded
  # color/size instead of var(--*)) and var() references to undefined custom properties.
  # Advisory-first: continue-on-error, findings surfaced as a step summary. A separate PR
  # promotes this to blocking once a first triaged run has been reviewed.
  lint-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/platforms/web/app/package-lock.json
      - run: npm ci
        working-directory: src/platforms/web/app
      - name: lint:tokens
        id: lint_tokens
        continue-on-error: true
        working-directory: src/platforms/web/app
        run: npm run lint:tokens
      - name: Step summary
        if: always()
        working-directory: src/platforms/web/app
        run: |
          echo "### Token-drift lint" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: ${{ steps.lint_tokens.outcome }} (advisory — non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline count: $(wc -l < stylelint-baseline.txt)" >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
