name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # Hermetic gate — no live DB, no secrets. The fast feedback loop agents (and humans) must pass.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck         # tsc --noEmit (src/) — was unchecked in CI before
      - run: npm run test:hermetic     # adapter + architecture/boundary + template/install guards (no live DB)

  # DB-layer gate — the crystal suite that needs a real Mongo (MongoIntella, MongoModorum,
  # executionWebhook, Consuetudinum, the Compiler↔Mongo LoRA repro, …). NOT covered by the
  # hermetic `verify` job (which uses mock stores that diverge from real Mongo). This is the gate
  # that would have caught the 3 live bugs from 2026-06-09. See docs/agent-tasks/TASK-012.
  crystal-db:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      # run-with-env.sh no-ops the .env load when absent; the tests fall back to localhost:27017,
      # but we set MONGODB_URI explicitly for clarity. DB name is hardcoded `noemaplane_test`.
      - run: npm run test:crystal
        env:
          MONGODB_URI: mongodb://localhost:27017

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
