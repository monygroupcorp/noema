name: CLA Assistant

# Gates ONLY external pull requests. It never touches your own shipping:
#  - direct pushes to branches are not gated at all (this runs on PRs only)
#  - everyone on `allowlist` (you + bots) auto-passes, never asked to sign
#  - it only blocks a MERGE if you add it as a required status check in branch
#    protection — leave it non-required and it can never stop you shipping.
#
# One-time setup to make it functional: create a repo secret PERSONAL_ACCESS_TOKEN
# (a PAT with `repo` scope) so signatures can be written to the `cla-signatures`
# branch. Until that secret exists the check simply errors harmlessly (non-blocking
# as long as it is not a required check).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: 'https://github.com/monygroupcorp/noema/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # These accounts are NEVER asked to sign and NEVER gated — your velocity is untouched.
          allowlist: monyrth,*[bot]
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✍️'
