name: Release Please

# build-and-push must run whenever a release tag exists for the commit this run is building,
# regardless of whether the release-please job itself succeeded. `always()` on that job alone
# is not enough: release-please can cut the tag and GitHub release and then fail on a later
# step (e.g. commenting on the release PR), which leaves its `releases_created` output empty
# even though the release already exists. Trusting that output as the sole gate means a tag
# can exist with no image built for it. So build-and-push checks the tag directly — does
# refs/tags/<version> exist and does it point at this commit — and only falls back to the
# `releases_created` output and the tag-push trigger as secondary signals. The tag-push route
# is the manual/backup path for a hand-pushed tag; it also covers pushes that don't originate
# from this workflow, since GITHUB_TOKEN-authored pushes don't trigger new runs.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # Manifest mode: release-please-config.json + .release-please-manifest.json
      # (both at repo root, the action's default paths).
      # Do NOT re-add `release-type:` here — passing it puts the action in
      # non-manifest mode, where it ignores the pinned last-release version and
      # bootstraps at 1.0.0. That happened during the 2026-08-05 cutover: the
      # v4.11.15 release commit sits behind 884 grafted commits, past the
      # history-walk cap, so release-please concluded the repo had never shipped.
      - uses: googleapis/release-please-action@v4
        id: release

  build-and-push:
    needs: release-please
    # Run regardless of the release-please job's outcome — the tag-existence check below
    # decides whether there is actually anything to build.
    if: always()
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(jq -r '.["."]' .release-please-manifest.json)"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "could not resolve a version tag (got '$TAG')" >&2; exit 1 ;;
          esac
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      # The real gate. A tag existing and pointing at this commit means a release was cut for
      # this push, whether or not release-please's own job reported success — its
      # `releases_created` output and the tag-push trigger are kept only as a fallback for
      # when the tag lookup itself can't run (e.g. fetch failure).
      - name: Check whether a release tag points at this commit
        id: tagcheck
        run: |
          git fetch --tags origin
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}^{commit}" || true)
          if [[ -n "$TAG_SHA" && "$TAG_SHA" == "$(git rev-parse HEAD)" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.release-please.outputs.releases_created }}" == "true" || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Get build info
        if: steps.tagcheck.outputs.should_build == 'true'
        id: build_info
        run: |
          echo "sha=$(git log --first-parent --skip=1 -1 --pretty=format:%h)" >> $GITHUB_OUTPUT
          echo "msg=$(git log --first-parent --skip=1 -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3
        if: steps.tagcheck.outputs.should_build == 'true'

      - uses: docker/login-action@v3
        if: steps.tagcheck.outputs.should_build == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        if: steps.tagcheck.outputs.should_build == 'true'
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        if: steps.tagcheck.outputs.should_build == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.build_info.outputs.sha }}
            COMMIT_MSG=${{ steps.build_info.outputs.msg }}
