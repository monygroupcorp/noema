name: Release Please

# build-and-push runs in the same workflow run that cuts the release, gated on the
# release-please job's aggregate `releases_created` output. `always()` means a failure or
# skip of release-please does not skip this job — a later step in release-please (e.g.
# commenting on the release PR) can fail after the tag/release is already cut, and this must
# not strand the build. The tag-push route is retained as a manual/backup path for a
# hand-pushed tag; both entry paths resolve the version without relying on a tag push event
# reaching this workflow, since GITHUB_TOKEN-authored pushes don't trigger new runs.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # Manifest mode: release-please-config.json + .release-please-manifest.json
      # (both at repo root, the action's default paths).
      # Do NOT re-add `release-type:` here — passing it puts the action in
      # non-manifest mode, where it ignores the pinned last-release version and
      # bootstraps at 1.0.0. That happened during the 2026-08-05 cutover: the
      # v4.11.15 release commit sits behind 884 grafted commits, past the
      # history-walk cap, so release-please concluded the repo had never shipped.
      - uses: googleapis/release-please-action@v4
        id: release

  build-and-push:
    needs: release-please
    if: >-
      always() && (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.release-please.outputs.releases_created == 'true'
      )
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(jq -r '.["."]' .release-please-manifest.json)"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "could not resolve a version tag (got '$TAG')" >&2; exit 1 ;;
          esac
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Get build info
        id: build_info
        run: |
          echo "sha=$(git log --first-parent --skip=1 -1 --pretty=format:%h)" >> $GITHUB_OUTPUT
          echo "msg=$(git log --first-parent --skip=1 -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.build_info.outputs.sha }}
            COMMIT_MSG=${{ steps.build_info.outputs.msg }}
