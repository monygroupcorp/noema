name: Release Please

# Build is decoupled from the release-please job's own success. release-please cuts the
# tag/release, then tries to comment on the release PR — if that PR's conversation is
# locked, the comment step fails, the whole release-please job fails, and its outputs never
# reach a `needs:`-gated build job. v5.0.0 (2026-08-06) shipped no image for exactly this
# reason; the manual docker-publish.yml workflow had to be dispatched by hand. build-and-push
# now triggers directly on the `v*` tag push instead, so it fires regardless of what happens
# in release-please's own job.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Manifest mode: release-please-config.json + .release-please-manifest.json
      # (both at repo root, the action's default paths).
      # Do NOT re-add `release-type:` here — passing it puts the action in
      # non-manifest mode, where it ignores the pinned last-release version and
      # bootstraps at 1.0.0. That happened during the 2026-08-05 cutover: the
      # v4.11.15 release commit sits behind 884 grafted commits, past the
      # history-walk cap, so release-please concluded the repo had never shipped.
      - uses: googleapis/release-please-action@v4
        id: release

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Get build info
        id: build_info
        run: |
          echo "sha=$(git log --first-parent --skip=1 -1 --pretty=format:%h)" >> $GITHUB_OUTPUT
          echo "msg=$(git log --first-parent --skip=1 -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.build_info.outputs.sha }}
            COMMIT_MSG=${{ steps.build_info.outputs.msg }}
