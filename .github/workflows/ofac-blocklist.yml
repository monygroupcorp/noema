name: Refresh OFAC blocklist

# Keeps data/ofac-blocklist.json current with the OFAC SDN crypto-address set.
# The deposit sanctions screen (src/compliance/SanctionsScreen.ts) is only as
# fresh as this file — staleness is the sole residual risk once the hook exists.
# Runs daily and on demand; commits the file back to main only when it changes.

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Refresh blocklist from OFAC SDN mirror
        run: npx tsx scripts/refresh-ofac-blocklist.ts data/ofac-blocklist.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/ofac-blocklist.json; then
            echo "OFAC blocklist unchanged — nothing to commit."
            exit 0
          fi
          count=$(node -e "console.log(require('./data/ofac-blocklist.json').length)")
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ofac-blocklist.json
          git commit -m "chore(compliance): refresh OFAC blocklist (${count} addresses)"
          git push
