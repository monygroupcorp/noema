# Noema Production — Docker Compose
#
# This file declares all containers. deploy.sh orchestrates the
# lifecycle (pull, keystore decrypt, health check, rollback).
#
# Usage from deploy.sh:
#   ETHEREUM_SIGNER_PRIVATE_KEY="..." docker compose -f docker-compose.prod.yml up -d bot
#   docker compose -f docker-compose.prod.yml up -d staging
#   docker compose -f docker-compose.prod.yml up -d caddy

x-common: &common
  image: ghcr.io/monygroupcorp/noema:${VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  networks:
    - hyperbot
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges

services:
  clip:
    image: ghcr.io/monygroupcorp/noema-clip:${VERSION:-latest}
    container_name: noema-clip
    build:
      context: ./clip_service
    restart: unless-stopped
    networks:
      hyperbot:
        aliases:
          - clip
    mem_limit: 1200m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  bot:
    <<: *common
    container_name: hyperbotcontained
    depends_on:
      clip:
        condition: service_healthy
    environment:
      - ETHEREUM_SIGNER_PRIVATE_KEY=${ETHEREUM_SIGNER_PRIVATE_KEY:-}
      - MAINTENANCE_MODE_FILE=/var/run/hyperbot/maintenance.flag
      - CEREMONY_ZKEY_DIR=/var/lib/noema/ceremony
      - COLLECTION_EXPORT_PROCESSING_ENABLED=false
    volumes:
      - /var/run/hyperbot:/var/run/hyperbot
      # Private compliance module (ADR-0012 §49) — the real OFAC sanctions screen and the
      # CSAM/NCMEC gate. Host state, deliberately absent from the image; the app dynamically
      # imports ./private/compliance/index.js at boot. deploy.sh mounts the same path, and
      # this service must match it: started without the mount, the app silently falls back to
      # its permissive stubs and deposit screening becomes a no-op. An empty directory is safe
      # and expected on a box that has no module — the fallback is the same, with a loud warning.
      - ${COMPLIANCE_DIR:-/opt/noema/private/compliance}:/usr/src/app/dist/private/compliance:ro
      # Arcanum ceremony custody — the trusted-setup chain's .zkey files. The transcript is in
      # the database and outlives every deploy; without this mount the keys it names live in the
      # container and do not, so a deploy leaves an open ceremony advertising a chain head no
      # contributor can download and no upload can extend. deploy.sh mounts the same path and
      # sets the same CEREMONY_ZKEY_DIR; the two must stay in step. Empty is correct until a
      # ceremony opens.
      - ${CEREMONY_DIR:-/opt/noema/ceremony}:/var/lib/noema/ceremony
    mem_limit: 900m
    networks:
      hyperbot:
        aliases:
          - hyperbot

  staging:
    <<: *common
    container_name: hyperbot-staging
    image: ghcr.io/monygroupcorp/noema:staging
    env_file: .env.staging
    networks:
      hyperbot:
        aliases:
          - hyperbot-staging

  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hyperbot

networks:
  hyperbot:
    name: hyperbot_network

volumes:
  caddy_data:
  caddy_config:
